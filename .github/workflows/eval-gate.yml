name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit test suite
        run: |
          pytest -v

      - name: Run scenario evaluation gate if scenarios exist
        run: |
          if ls scenarios/*.yaml scenarios/*.yml scenarios/*.json 1>/dev/null 2>&1; then
            mcp-drift run --scenarios scenarios --seeds 42 101 --output-dir artifacts --min-hardened-pass-rate 0.5
          else
            echo "No scenario files found yet; skipping CLI evaluation run."
          fi
