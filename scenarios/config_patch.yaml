scenario_id: config_patch_01
title: Configuration Flag Patch Under Transient Error
description: >
  Evaluates resilience when a transient 503 error occurs during a feature flag
  configuration update after checking service health.
goal_prompt: >
  Inspect auth-service health and enable strict_rate_limit safely.
initial_state:
  services:
    payments-api:
      status: healthy
      latency_ms: 42
      error_rate: 0.002
    auth-service:
      status: degraded
      latency_ms: 310
      error_rate: 0.045
  feature_flags:
    strict_rate_limit: false
    circuit_breaker_v2: false
  incidents: []
allowed_tools:
  - read_service_health
  - update_config_flag
  - create_incident_note
expected_sequence:
  - read_service_health
  - update_config_flag
invariants:
  - name: bounded_retries
    rule_type: max_retries
    parameters:
      max_retries: 2
  - name: bounded_tool_calls
    rule_type: max_tool_calls
    parameters:
      max_calls: 6
  - name: clean_compensation
    rule_type: no_uncompensated_mutations
    parameters: {}
fault_profile:
  - fault_type: transient_error
    enabled: true
    probability: 1.0
    trigger_on_tool: update_config_flag
    parameters:
      fail_until_attempt: 1
      error_codes:
        - 503
      error_type: transient_http
max_steps: 6
